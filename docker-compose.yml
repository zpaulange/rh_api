# MySQL de développement : docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: sikarh-mysql
    # Développement uniquement : durabilité assouplie (disque local lent). En production, conserver les
    # réglages par défaut de MySQL (innodb_flush_log_at_trx_commit=1, journal binaire synchronisé).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=2
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: sikarh_root_dev
      MYSQL_DATABASE: sikarh
      MYSQL_USER: sikarh
      MYSQL_PASSWORD: sikarh_dev
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - sikarh-mysql-data:/var/lib/mysql
volumes:
  sikarh-mysql-data:
    external: true
